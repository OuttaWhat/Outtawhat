<script>
const SUPABASE_URL =
  "https://ccmjmzprlsozrignttbs.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_3ruRpcdeojLycEgoCGKXsA_kALRhCB0";

document
  .getElementById("signup-form")
  .addEventListener("submit", async function(event) {

    event.preventDefault();

    const button = document.getElementById("signup-button");
    const status = document.getElementById("signup-status");

    const firstName =
      document.getElementById("first-name").value.trim();

    const lastName =
      document.getElementById("last-name").value.trim();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    button.disabled = true;
    button.textContent = "PLEASE WAIT...";
    status.textContent = "Creating your registration...";

    try {
      const response = await fetch(
        SUPABASE_URL + "/auth/v1/signup",
        {
          method: "POST",
          headers: {
            "apikey": SUPABASE_ANON_KEY,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email: email,
            password: password,
            data: {
              first_name: firstName,
              last_name: lastName,
              full_name: firstName + " " + lastName
            }
          })
        }
      );

      const result = await response.json();

      if (!response.ok) {
        throw new Error(
          result.msg ||
          result.message ||
          result.error_description ||
          "Signup failed. Please try again."
        );
      }

      status.textContent =
        "You're almost there! Check your email and click the verification link to complete your registration.";

      this.reset();

    } catch (error) {
      status.textContent = error.message;
    }

    button.disabled = false;
    button.textContent = "JOIN THE FIRST 10,000";
  });
</script>
